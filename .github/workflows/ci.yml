# ════════════════════════════════════════════════════════════════════
#  Wild Mystery · intégration continue
#
#  Rien ne part en production sans cette chaîne. L'ordre des travaux
#  est celui d'ARCHITECTURE.md §5 : on vérifie la forme, puis les
#  règles, puis l'orchestration, puis le vrai Postgres.
# ════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  #  Épinglé au patch, et pas en "2.x" : `deno bundle` est annoncé
  #  expérimental par Deno lui-même. Une version flottante ferait changer
  #  le fichier livré aux joueurs sans qu'on touche à une ligne de code.
  DENO_VERSION: "2.9.6"
  PGTAP_VERSION: "v1.3.3"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1 · la forme ──────────────────────────────────────────────────
  forme:
    name: Forme et garde-fou
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/
      - name: Garde-fou
        run: bash outils/garde-fou.sh

  # ── 2 · les règles ────────────────────────────────────────────────
  domaine:
    name: Domaine (100 % exigés)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Tests du domaine
        run: deno test src/domaine/
      - name: Couverture du domaine
        run: bash outils/couverture.sh

  # ── 3 · l'orchestration ───────────────────────────────────────────
  usage:
    name: Cas d'usage et adaptateurs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Tests de cas d'usage
        if: hashFiles('src/application/**/*.test.ts') != ''
        run: deno test --allow-env src/application/
      - name: Aucun cas d'usage encore écrit
        if: hashFiles('src/application/**/*.test.ts') == ''
        run: |
          echo "::warning::src/application/ ne contient aucun test — étape sans effet."
      # Les adaptateurs se testent sur des pages enregistrées sur le vrai
      # forum : d'où la lecture de fichiers, et aucun accès réseau.
      - name: Tests d'adaptateurs
        if: hashFiles('src/adaptateurs/**/*.test.ts') != ''
        run: deno test --allow-read src/adaptateurs/

  # ── 4 · le faux ne doit pas mentir au vrai ────────────────────────
  # La même suite tourne deux fois : contre l'adaptateur en mémoire,
  # puis contre l'adaptateur Supabase branché sur un vrai Postgres.
  # Si les deux divergent, c'est ici que ça casse.
  contrat:
    name: Contrat (${{ matrix.cible }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cible: [memoire, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wild_mystery
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRAT_CIBLE: ${{ matrix.cible }}
      CONTRAT_PGURL: postgres://postgres:ci@localhost:5432/wild_mystery
      DATABASE_URL: postgres://postgres:ci@localhost:5432/wild_mystery
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Monter les migrations
        if: matrix.cible == 'postgres'
        run: |
          # Les migrations, dans l'ordre. C'est le même chemin que
          # `supabase db push` : si l'une ne passe pas ici, elle ne passera
          # pas en production non plus.
          for m in supabase/migrations/*.sql; do
            echo "── $m"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$m"
          done
      # --allow-run : la suite de contrat appelle les fonctions SQL par
      # psql, pour n'ajouter aucune dépendance au dépôt (contrat §8).
      - name: Tests de contrat
        if: hashFiles('src/contrat/**/*.ts') != ''
        run: |
          set -o pipefail
          deno test --allow-env --allow-net --allow-read --allow-run src/contrat/ 2>&1 \
            | tee /tmp/contrat.txt
      # Un test qui se saute en silence laisserait croire à une couverture
      # qu'on n'a pas. Sur la cible postgres, on exige de le voir tourner.
      - name: Le contrat Supabase a vraiment tourné
        if: matrix.cible == 'postgres' && hashFiles('src/contrat/**/*.ts') != ''
        run: |
          grep -q "Supabase · " /tmp/contrat.txt
          grep -q "clôture réelle · " /tmp/contrat.txt
          # La boutique, ajoutée le 5 octobre. Ses onze cas sont les seuls
          # qui exécutent le SQL de facturation : sans eux, `boutique_servir`
          # peut à nouveau ne servir AUCUNE commande sans que rien ne crie,
          # ce qui est exactement ce qui est arrivé pendant trois jours.
          grep -q "boutique réelle · " /tmp/contrat.txt
          # Le pokédex, ajouté le 6 octobre. `ranger_pokedex` a été écrite
          # deux fois et cassée deux fois ; ces huit cas sont les seuls qui
          # exécutent le vrai SQL de rangement, et le seul endroit où le
          # désaccord de dates entre la clôture et le rangement se voit.
          grep -q "pokédex réel · " /tmp/contrat.txt
          # Les services, ajoutés le 6 octobre. Huit fonctions de 0001 et
          # 0002 qui n avaient JAMAIS ete executees par un test : quatre de
          # celles qu on a regardees etaient cassees. Ces treize cas sont le
          # seul endroit ou leur SQL tourne.
          grep -q "services réels · " /tmp/contrat.txt
          # La vie de Rhode, ajoutee le 6 octobre. Ses huit cas verifient
          # que la ligne de journal est ecrite DANS la transaction du debit,
          # et surtout qu elle ne dit ni le prix ni la liste des objets : le
          # journal est public.
          grep -q "vie de Rhode · " /tmp/contrat.txt
          # La concurrence, ajoutee le 6 octobre. Ses six cas sont les seuls
          # qui ouvrent DEUX connexions : pgTAP tourne dans une seule
          # session et ne peut pas voir deux appels se croiser. Sans eux,
          # `boutique_servir` peut a nouveau lever au lieu de rendre
          # « deja servie », et la releve boucle sur un message deja servi.
          grep -q "concurrence · " /tmp/contrat.txt
          ! grep -q "IGNORÉ faute de base" /tmp/contrat.txt
      - name: Aucun test de contrat encore écrit
        if: hashFiles('src/contrat/**/*.ts') == ''
        run: |
          echo "::warning::src/contrat/ est vide — l'adaptateur en mémoire n'est pas encore confronté au vrai."

  # ── 5 · les garanties qui vivent dans la base ─────────────────────
  base:
    name: Garanties SQL (pgTAP)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wild_mystery
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgres://postgres:ci@localhost:5432/wild_mystery
    steps:
      - uses: actions/checkout@v5

      - name: pg_prove
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-client libtap-parser-sourcehandler-pgtap-perl

      - name: Installer pgTAP dans la base de CI
        run: |
          curl -fsSL -o /tmp/pgtap.sql.in \
            "https://raw.githubusercontent.com/theory/pgtap/${PGTAP_VERSION}/sql/pgtap.sql.in"
          sed 's/MODULE_PATHNAME/pgtap/g; s/__OS__/linux/g; s/__VERSION__/1.03/g' \
            /tmp/pgtap.sql.in > /tmp/pgtap.sql
          psql "$PGURL" -q -v ON_ERROR_STOP=1 -f /tmp/pgtap.sql

      - name: Monter les migrations
        run: |
          for m in supabase/migrations/*.sql; do
            echo "── $m"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$m"
          done

      - name: Lancer la suite
        run: pg_prove --ext .sql -d "$PGURL" supabase/tests/

  # ── 5 bis · le navigateur ─────────────────────────────────────────
  navigateur:
    name: Navigateur et fichier livré
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      #  `deno bundle` télécharge esbuild au tout premier passage, puis
      #  tourne hors réseau. C'est la seule entorse à la règle « zéro
      #  dépendance réseau » (ARCHITECTURE §8), et le cache la referme :
      #  après un passage, plus rien ne sort.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('deno.json') }}
          restore-keys: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - run: deno task test:navigateur

      #  LA VÉRIFICATION QUI COMPTE. jsDelivr sert `js/wild-mystery.js`
      #  depuis le dépôt, pas depuis une étape de construction : si le
      #  fichier commité ne correspond pas aux sources, les joueurs
      #  reçoivent du code que personne n'a relu.
      - name: Le fichier livré est bien celui des sources
        run: |
          deno task construire
          if ! git diff --quiet -- js/wild-mystery.js; then
            echo "::error::js/wild-mystery.js ne correspond pas aux sources."
            echo "::error::Relance « deno task construire » et commite le résultat."
            git --no-pager diff --stat -- js/wild-mystery.js
            exit 1
          fi

  # ── 5 bis · le contraste des pages collees ────────────────────────
  #
  #  POURQUOI UN TRAVAIL A PART. « Ce texte me parait pale » n'est pas une
  #  mesure, et un jeton de texte doux sur un pave teinte peut tomber a
  #  4,49 contre 4,5 exiges — un cheveu qu'aucun oeil ne voit et qu'un
  #  lecteur mal-voyant paie. Le harnais monte chaque page avec les jetons
  #  et la feuille assemblee, pose le VRAI sommaire par le module, et
  #  mesure chaque texte sur son fond reel, dans les deux themes et a
  #  quatre largeurs.
  #
  #  Il a trouve deux defauts le jour ou il a ete ecrit, et il s'est
  #  trompe deux fois avant de servir. Les deux fois c'etait lui qui avait
  #  tort — d'ou l'essai a blanc ci-dessous, qui refuse un harnais muet.
  contraste:
    name: Contraste des pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.cache/ms-playwright
          key: contraste-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('outils/contraste.mjs') }}
          restore-keys: contraste-${{ runner.os }}-${{ env.DENO_VERSION }}-

      #  Le binaire de Chromium ne vient pas avec le paquet npm : il
      #  s'installe a part, et c'est la seule dependance reseau de ce
      #  travail.
      - name: Installer Chromium
        run: npx --yes playwright@1.49.1 install --with-deps chromium

      #  La feuille servie est un fichier derive : on la reconstruit
      #  avant de la mesurer, sinon on mesurerait une version perimee et
      #  on dirait « zero defaut » sans rien avoir verifie.
      - run: bash outils/css.sh
      - run: deno task harnais

      - name: Chaque page collee, dans les deux themes
        run: |
          echec=0
          for page in pages/*.html; do
            echo "── $page"
            deno task contraste "$page" || echec=1
          done
          exit $echec

      #  L'ESSAI A BLANC. Un harnais qui ne mesure rien passe en vert, et
      #  c'est exactement comme ca qu'un test de contraste devient un
      #  decor. On casse donc une page expres, et on exige qu'il crie.
      #
      #  LA FEUILLE D'ESSAI EST EN 99, ET C'EST LE POINT. Ecrite d'abord
      #  dans `02`, la regle etait ecrasee par celle de `08` — meme
      #  specificite, la derniere gagne — et l'essai passait en vert sans
      #  rien avoir casse. Un essai a blanc qui ne casse rien n'essaie
      #  rien ; celui-la a failli entrer tel quel.
      - name: Le harnais attrape vraiment quelque chose
        run: |
          printf '#modernbb .wm-carte__titre { color: #f6efe7; }\n' > css/99-essai-contraste.css
          bash outils/css.sh
          vu=1
          deno task contraste pages/annexe-03-le-reglement.html || vu=0
          rm -f css/99-essai-contraste.css
          bash outils/css.sh
          if [ "$vu" = "1" ]; then
            echo "::error::Le harnais n'a RIEN vu sur un titre illisible — il ne mesure plus."
            exit 1
          fi
          echo "Le harnais a bien crie."

  # ── 6 · le déploiement, seulement sur un tag v* ───────────────────
  deploiement:
    name: Déploiement
    needs: [forme, domaine, usage, contrat, base, navigateur, contraste]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 1. les migrations SQL d'abord : les fonctions Edge en dépendent
      - name: Migrations SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

      # 2. puis les fonctions Edge. Les trois secrets du compte de
      #    publication ne passent pas par ici : ils sont posés à la
      #    main dans Supabase › Edge Functions › Secrets.
      - name: Fonctions Edge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy releve

      # 3. enfin la bascule du navigateur. jsDelivr sert le tag, donc
      #    l'URL est immuable : il n'y a rien à purger, mais les deux
      #    lignes du template Forumactif sont à remplacer à la main
      #    (templates réservés au fondateur, aucune API).
      - name: Les deux lignes à coller dans Forumactif
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://cdn.jsdelivr.net/gh/by-teenspirit/wild-mystery@${TAG}"
          {
            echo "## Bascule du navigateur vers \`${TAG}\`"
            echo
            echo "À coller dans **Affichage › Templates › overall_header**, en remplacement des deux lignes de la version précédente :"
            echo
            echo '```html'
            echo "<link rel=\"stylesheet\" href=\"${BASE}/css/wild-mystery.css\">"
            echo "<script defer src=\"${BASE}/js/wild-mystery.js\"></script>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
