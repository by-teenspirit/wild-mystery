<!-- ══════════════════════════════════════════════════════════════════
     LA CARTE DRESSEUR — le code à coller dans un message

     Ce fichier n'est PAS un gabarit Forumactif : il ne va pas dans
     Affichage > Templates. C'est le code qu'un joueur copie dans son
     message, et que tu postes dans « Code des fiches ».

     ── CE QUE LE JOUEUR REMPLIT, ET CE QUI SE REMPLIT TOUT SEUL ─────

     À LA MAIN, trois choses, et rien d'autre :
       · l'adresse de son avatar,
       · son nom de personnage,
       · son numéro de dresseur.

     PAR NOTRE CODE, quand `mod-tcard` sera en ligne :
       · le palier, qui est son groupe sur le forum,
       · les pokédollars, qui sont un champ de son profil,
       · les badges obtenus, qui sont ses récompenses Forumactif,
       · l'équipe, qui vient de Supabase.

     Les valeurs écrites ici sont donc des valeurs d'attente : elles
     s'affichent tant que le script ne tourne pas, et il les remplace
     dès qu'il tourne. Une carte collée aujourd'hui marchera demain
     sans que personne n'y retouche.

     ── CE QU'IL NE FAUT PAS ENLEVER ────────────────────────────────

     Les attributs `data-wm-…`. Ce sont eux que le script cherche ;
     une carte sans eux reste jolie et reste fausse.

     ── AUCUNE ADRESSE D'IMAGE DANS LES BADGES, ET C'EST VOULU ──────

     Un code collé dans un message y reste pour toujours. Si les sept
     badges portaient une adresse en dur, changer d'hébergeur voudrait
     dire réécrire tous les messages de tous les joueurs. Le badge ne
     porte donc que son nom (`data-wm-badge`) ; l'image est posée par
     notre script, dont l'adresse, elle, se change en un endroit.

     ── SEPT BADGES, PAS HUIT ───────────────────────────────────────

     La planche « Mon jeu » en dessine huit, avec des noms qui ne sont
     pas ceux de Rhode (Portevent, Orion…). Les arènes réelles, celles
     des annexes et du dossier `img/badges/`, sont sept : Station
     Service, Samaragd, Port-Amarée, Suerebe, Pyrite, Tour Titanite et
     Île Ténèbra. Les quatre colosseums ne comptent pas pour la Ligue.

     ── POUR MARQUER UN BADGE COMME OBTENU, À LA MAIN ───────────────

     Enlever `wm-tcard__badge--agagner` de sa ligne. C'est tout.
     ══════════════════════════════════════════════════════════════════ -->
